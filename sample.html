<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevHub Explorer</title>
    <style>
       * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #f5f5f5;
            color: #222;
        }

         header {
            text-align: center;
            padding: 20px;
        }

        .search-box {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 20px;
        }

         .search-box input {
            padding: 10px;
            width: 300px;
        }

         .search-box button {
            padding: 10px 20px;
            cursor: pointer;
        }

         #results-container {
            display: grid;
            gap: 20px;
            padding: 20px;
        }

         .card {
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 8px;
        }

         .card h3 {
            margin-bottom: 10px;
        }

        .card p {
            margin-bottom: 8px;
        }

        footer {
            text-align: center;
            padding: 20px;
            margin-top: 20px;
        }


    </style>
</head>
<body>
    <header>
        <h1>DevHub Explorer</h1>
        <p>Search and explore open-source software projects.</p>
    </header>

    <main>
        <div class="search-box">
            <input type="text" id="search-input" placeholder="search repositories">
            <button id="search-btn">Search</button>
        </div>

        <div id="results-container"></div>
    </main>

    <footer><p>&copy; 2026 DevHub. Built with Vanilla JavaScript.</p></footer>

    <script>
       const searchInput = document.getElementById("search-input");
       const searchBtn = document.getElementById("search-btn");
    //    const resultsContainer = document.getElementById("results-container");

        async function searchRepositories(query) {
            const response = await fetch(`https://api.github.com/search/repositories?q=${query}&per_page=5`);
            const data = await response.json();

            const resultsContainer = document.getElementById("results-container");
            resultsContainer.textContent = "";

            if (data.items.length > 0) {
                data.items.forEach(repo => {
                    const card = document.createElement("div");
                    card.className = "card";

                    card.innerHTML = `
                    <h3>${repo.name}</h3>
                    <p>${repo.description || "No description provided."}</p>
                    <p>Stars: ${repo.stargazers_count}</p>
                    `;

                    resultsContainer.appendChild(card);
                });
            } else {
                resultsContainer.textContent = "No repositories found";
            }

        }

    searchBtn.addEventListener("click", function() {
        const query = searchInput.value.trim();

        if (query !== "") {
            searchRepositories(query);
    }
});
    </script>
</body>
</html>
